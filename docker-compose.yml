# Local development / smoke-test stack. Not used by Render.
# Render builds from Dockerfile only.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-10000}:10000"
    environment:
      APP_NAME: Subnexa
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "${APP_KEY:?Generate with php artisan key:generate --show and export APP_KEY}"
      APP_URL: http://localhost:10000
      FRONTEND_URL: http://localhost:3000
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: subnexa
      DB_USERNAME: subnexa
      DB_PASSWORD: secret
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      CACHE_CONFIG: "false"
      RUN_MIGRATIONS: "false"
      PORT: 10000
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:10000/up || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  mysql:
    image: mysql:8.4
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    environment:
      MYSQL_DATABASE: subnexa
      MYSQL_USER: subnexa
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - subnexa_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  subnexa_mysql_data:
